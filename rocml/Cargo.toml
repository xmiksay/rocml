[package]
name = "rocml"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dense Qwen3 GPU inference engine on top of rocml-core/rocml-hip/rocml-kernels"

[dependencies]
rocml-core = { path = "../rocml-core" }
rocml-hip = { path = "../rocml-hip" }
rocml-kernels = { path = "../rocml-kernels" }
half = "2"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: the chat template's `tojson` output (tool specs, tool-call
# arguments) must reproduce the caller's JSON key order byte-for-byte to
# match the official Jinja template's rendering.
serde_json = { version = "1", features = ["preserve_order"] }
